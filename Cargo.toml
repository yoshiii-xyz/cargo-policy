[package]
name = "cargo-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Compile explicit Cargo dependency-source policies into checks"
license = "MIT"
repository = "https://github.com/yoshiii-xyz/cargo-policy"
keywords = ["cargo", "dependencies", "policy", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
